name: PR rastreabilidade
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir campos obrigatorios
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python3 scripts/validate_pr_traceability.py
